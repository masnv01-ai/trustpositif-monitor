name: Prepare isolated VPS monitor
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install cryptography
      - name: Encrypt configuration for VPS
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          SURFSHARK_USERNAME: ${{ secrets.SURFSHARK_USERNAME }}
          SURFSHARK_PASSWORD: ${{ secrets.SURFSHARK_PASSWORD }}
        run: |
          python - <<'PY'
          import os, json, base64, secrets
          from pathlib import Path
          from cryptography.hazmat.primitives import serialization, hashes
          from cryptography.hazmat.primitives.asymmetric import padding
          from cryptography.hazmat.primitives.ciphers.aead import AESGCM
          names = ['FIREBASE_SERVICE_ACCOUNT', 'SURFSHARK_USERNAME', 'SURFSHARK_PASSWORD']
          assert all(os.environ.get(n, '').strip() for n in names), 'Required configuration missing'
          firebase = json.loads(os.environ[names[0]])
          assert firebase.get('project_id') == 'panel-ai-result', 'Wrong Firebase project'
          payload = json.dumps({'firebase': firebase, 'vpn_username': os.environ[names[1]].strip(), 'vpn_password': os.environ[names[2]].strip(), 'archive': ''}).encode()
          public = serialization.load_der_public_key(bytes.fromhex(''))
          key, nonce = secrets.token_bytes(32), secrets.token_bytes(12)
          wrapped = public.encrypt(key, padding.OAEP(mgf=padding.MGF1(hashes.SHA256()), algorithm=hashes.SHA256(), label=None))
          ciphertext = AESGCM(key).encrypt(nonce, payload, b'trustpositif-vps-139.190.99.143')
          encode = lambda x: base64.b64encode(x).decode()
          Path('sealed.json').write_text(json.dumps(dict(key=encode(wrapped), nonce=encode(nonce), ciphertext=encode(ciphertext))))
          print('Encrypted configuration prepared for the verified VPS public key.')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: encrypted-vps-bootstrap
          path: sealed.json
          retention-days: 1
